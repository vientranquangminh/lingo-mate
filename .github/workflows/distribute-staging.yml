name: Build & Distribute Android (staging)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: distribute-staging
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: lingo-mate-4f38d

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      release_signing: ${{ steps.check.outputs.release_signing }}
    steps:
      - name: Check the secrets and variables are set
        id: check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GROUPS: ${{ vars.FIREBASE_DISTRIBUTION_GROUPS }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT$GROUPS" ]; then
            echo "::notice::App Distribution is not set up yet, so the build is skipped. Setup: docs/ci-cd.md"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ok=true
          [ -n "$GROUPS" ] || { echo "::error::Variable FIREBASE_DISTRIBUTION_GROUPS is not set (a group alias in App Distribution → Testers & Groups)"; ok=false; }
          if [ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "::notice::No ANDROID_* keystore secrets: the test build is signed with a cached debug key"
            echo "release_signing=false" >> "$GITHUB_OUTPUT"
          else
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              [ -n "${!name}" ] || { echo "::error::Secret ANDROID_$name is not set (set all four or none)"; ok=false; }
            done
            echo "release_signing=true" >> "$GITHUB_OUTPUT"
          fi
          [ -n "$GEMINI_API_KEY" ] || echo "::warning::Secret GEMINI_API_KEY is not set; the build will have no Gemini key"
          project=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r 'select(.type == "service_account") | .project_id' 2>/dev/null || true)
          [ "$project" = "$FIREBASE_PROJECT" ] || { echo "::error::Secret FIREBASE_SERVICE_ACCOUNT must be the JSON key of a $FIREBASE_PROJECT service account (found project: '${project:-none}')"; ok=false; }
          $ok
          echo "configured=true" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules/@angular
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app id and Flutter version
        id: meta
        run: |
          echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
          echo "app_id=$(jq -r '.flutter.platforms.android.buildConfigurations["src/dev"].appId' firebase.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.meta.outputs.flutter }}
          channel: stable
          cache: true

      - name: Keep the debug signing key between runs
        if: needs.config.outputs.release_signing != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create the debug signing key
        if: needs.config.outputs.release_signing != 'true'
        run: |
          [ -f ~/.android/debug.keystore ] || {
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          }
          info=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey)
          sha1=$(printf '%s' "$info" | sed -n 's/.*SHA1: //p')
          sha256=$(printf '%s' "$info" | sed -n 's/.*SHA256: //p')
          {
            echo "Debug signing key (the next step registers it with Firebase):"
            echo ""
            echo "- SHA-1: \`$sha1\`"
            echo "- SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Android keystore
        if: needs.config.outputs.release_signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key-release.jks

      - name: Create signing.properties
        if: needs.config.outputs.release_signing == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > android/signing.properties

      - name: Set up sign-in in Firebase
        continue-on-error: true
        env:
          APP_ID: ${{ steps.meta.outputs.app_id }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEYSTORE: ${{ needs.config.outputs.release_signing == 'true' && 'android/app/key-release.jks' || '/home/runner/.android/debug.keystore' }}
          STOREPASS: ${{ needs.config.outputs.release_signing == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          ALIAS: ${{ needs.config.outputs.release_signing == 'true' && secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
        run: .github/scripts/firebase-sign-in-setup.sh

      - name: Create .env.dev
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
        run: |
          {
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "LIVE_ENABLED=true"
            echo "APP_CHECK_DEBUG_TOKEN=$APP_CHECK_DEBUG_TOKEN"
            echo "DEVTOOLS_ENABLED=true"
          } > .env.dev

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release \
            --flavor dev \
            -t lib/main_dev.dart \
            --dart-define-from-file=.env.dev \
            --build-number=${{ github.run_number }}

      - name: Disk usage report
        if: always()
        run: df -h /

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Create Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          APP_ID: ${{ steps.meta.outputs.app_id }}
          GROUPS: ${{ vars.FIREBASE_DISTRIBUTION_GROUPS }}
          RELEASE_NOTES: "staging #${{ github.run_number }} (${{ github.sha }}): ${{ github.event.head_commit.message || 'manual run' }}"
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-dev-release.apk \
            --project "$FIREBASE_PROJECT" \
            --app "$APP_ID" \
            --groups "$GROUPS" \
            --release-notes "$RELEASE_NOTES"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" android/app/key-release.jks android/signing.properties .env.dev
