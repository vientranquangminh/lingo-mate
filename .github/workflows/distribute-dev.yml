name: Build & Distribute Android (dev)

# Every push to main builds the dev flavor (com.lingomate.app.dev, Firebase
# project lingo-mate-4f38d) and distributes the APK to the testers through
# Firebase App Distribution. Setup: docs/ci-cd.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: distribute-dev
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: lingo-mate-4f38d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules/@angular
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      # Fails in seconds, not after the build, when a secret or variable is
      # missing (Settings → Secrets and variables → Actions).
      - name: Check the secrets and variables are set
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GROUPS: ${{ vars.FIREBASE_DISTRIBUTION_GROUPS }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ok=true
          [ -n "$GROUPS" ] || { echo "::error::Variable FIREBASE_DISTRIBUTION_GROUPS is not set (a group alias in App Distribution → Testers & Groups)"; ok=false; }
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Secret ANDROID_$name is not set"; ok=false; }
          done
          [ -n "$GEMINI_API_KEY" ] || echo "::warning::Secret GEMINI_API_KEY is not set; the build will have no Gemini key"
          project=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r 'select(.type == "service_account") | .project_id' 2>/dev/null || true)
          [ "$project" = "$FIREBASE_PROJECT" ] || { echo "::error::Secret FIREBASE_SERVICE_ACCOUNT must be the JSON key of a $FIREBASE_PROJECT service account (found project: '${project:-none}')"; ok=false; }
          $ok

      - name: Read app id and Flutter version
        id: meta
        run: |
          echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
          echo "app_id=$(jq -r '.flutter.platforms.android.buildConfigurations["src/dev"].appId' firebase.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.meta.outputs.flutter }}
          channel: stable
          cache: true

      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key-release.jks

      - name: Create signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > android/signing.properties

      - name: Create .env.dev
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
        run: |
          {
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "LIVE_ENABLED=true"
            echo "APP_CHECK_DEBUG_TOKEN=$APP_CHECK_DEBUG_TOKEN"
          } > .env.dev

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release \
            --flavor dev \
            -t lib/main_dev.dart \
            --dart-define-from-file=.env.dev \
            --build-number=${{ github.run_number }}

      - name: Disk usage report
        if: always()
        run: df -h /

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Create Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      # The commit message goes through env, not into the script, so quotes or
      # backticks in it cannot break the command.
      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          APP_ID: ${{ steps.meta.outputs.app_id }}
          GROUPS: ${{ vars.FIREBASE_DISTRIBUTION_GROUPS }}
          RELEASE_NOTES: "Build #${{ github.run_number }}: ${{ github.event.head_commit.message || 'manual run' }}"
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-dev-release.apk \
            --project "$FIREBASE_PROJECT" \
            --app "$APP_ID" \
            --groups "$GROUPS" \
            --release-notes "$RELEASE_NOTES"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" android/app/key-release.jks android/signing.properties .env.dev
