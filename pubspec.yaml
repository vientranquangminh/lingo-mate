name: flutter_template
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.14.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  equatable: ^3.0.0
  shared_preferences: ^2.2.2
  flutter_riverpod: ^3.1.0
  flutter_svg: ^2.0.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  intl: ^0.20.2
  go_router: ^18.0.1
  injectable: ^3.0.0
  retrofit: ^4.0.3
  flutter_secure_storage: ^11.0.0
  flutter_portal: ^1.1.4
  flutter_screenutil: ^5.9.3
  overlay_support: ^2.1.0
  json_annotation: ^4.12.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.0
  build_runner: ^2.4.14
  flutter_gen_runner: ^5.8.0
  injectable_generator: ^3.1.3
  retrofit_generator: ^10.2.1
  json_serializable: ^6.5.4
  freezed: ^4.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/imgs/
    - assets/svgs/

flutter_gen:
  integrations:
    flutter_svg: true
  colors:
    enabled: true
    inputs:
      - assets/color/values/colors.xml
