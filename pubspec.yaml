name: lingo_mate
description: "Live speech translation app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.14.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  equatable: ^3.0.0
  shared_preferences: ^2.2.2
  flutter_riverpod: ^3.1.0
  flutter_svg: ^2.0.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  intl: ^0.20.2
  go_router: ^18.0.1
  injectable: ^3.0.0
  retrofit: ^4.0.3
  flutter_secure_storage: ^11.0.0
  flutter_portal: ^1.1.4
  flutter_screenutil: ^5.9.3
  overlay_support: ^2.1.0
  json_annotation: ^4.12.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  firebase_core: ^5.2.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  firebase_app_check: ^0.5.2
  firebase_ai: ^5.2.0
  firebase_remote_config: ^7.1.0
  firebase_crashlytics: ^6.1.0
  record: ^7.2.0
  sherpa_onnx: ^2.0.3
  whisper_cpp_flutter_plus: ^0.5.1
  web_socket_channel: ^3.0.3
  google_mlkit_translation: ^1.0.3
  permission_handler: ^13.0.2
  connectivity_plus: ^7.3.2
  flutter_tts: ^4.2.5
  crypto: ^3.0.8
  firebase_analytics: ^13.1.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0
  app_links: ^7.2.2
  cloud_functions: ^7.1.0
  archive: ^4.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: ^14.1.0
  riverpod_lint: ^3.1.0
  build_runner: ^2.4.14
  flutter_gen_runner: ^5.8.0
  injectable_generator: ^3.1.3
  retrofit_generator: ^10.2.1
  json_serializable: ^6.5.4
  freezed: ^4.0.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/imgs/
    - assets/svgs/
    - assets/icons/
    - assets/quick_phrases/
    - assets/models/
    - assets/fonts/OFL-BeVietnamPro.txt
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700

flutter_gen:
  integrations:
    flutter_svg: true
  colors:
    enabled: true
    inputs:
      - assets/color/values/colors.xml
