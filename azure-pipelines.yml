name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - "*.md"
      - docs/**

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - "*.md"
      - docs/**

variables:
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      - name: buildNumber
        value: "0"
  - ${{ else }}:
      - name: buildNumber
        value: $[counter('app-build-number', 1)]
  - name: jdkVersion
    value: "17"
  - name: firebaseAndroidAppId
    value: ""
  - name: PUB_CACHE
    value: $(Pipeline.Workspace)/.pub-cache

stages:
  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - stage: Source
      displayName: Source
      jobs:
        - job: Version
          displayName: Set run name
          pool:
            vmImage: ubuntu-latest
          steps:
            - checkout: self
              fetchDepth: 1
            - bash: |
                set -euo pipefail
                version_name=$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)
                echo "##vso[build.updatebuildnumber]$(buildNumber) ($version_name)"
              displayName: Set run name to version and build number

  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - stage: Test
      displayName: Test
      dependsOn: []
      jobs:
        - job: Test
          displayName: Analyze and test
          pool:
            vmImage: ubuntu-latest
          timeoutInMinutes: 30
          steps:
            - checkout: self
              fetchDepth: 1

            - bash: |
                set -euo pipefail
                version_name=$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)
                echo "##vso[build.updatebuildnumber]PR #$(System.PullRequest.PullRequestNumber) ($version_name)"
              displayName: Set run name to PR number and version

            - template: ci/templates/flutter-setup.yml

            - bash: flutter analyze
              displayName: Analyze

            - bash: dart pub global activate junitreport
              displayName: Install junitreport

            - bash: flutter test --file-reporter json:build/test-results.json
              displayName: Run tests

            - bash: tojunit --input build/test-results.json --output build/test-results.xml
              displayName: Convert test results to JUnit
              condition: succeededOrFailed()

            - task: PublishTestResults@2
              displayName: Publish test results
              condition: succeededOrFailed()
              inputs:
                testResultsFormat: JUnit
                testResultsFiles: build/test-results.xml
                testRunTitle: Flutter tests
                failTaskOnFailedTests: true

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - stage: Approval
      displayName: Approval
      dependsOn: Source
      jobs:
        - deployment: Approve
          displayName: Approve production build
          pool:
            vmImage: ubuntu-latest
          environment: production
          strategy:
            runOnce:
              deploy:
                steps:
                  - download: none
                  - bash: echo "Production build of $(Build.BuildNumber) approved."
                    displayName: Record approval

    - stage: Build
      displayName: Build
      dependsOn: Approval
      jobs:
        - job: Android
          displayName: Android app bundle
          pool:
            vmImage: ubuntu-latest
          timeoutInMinutes: 90
          steps:
            - bash: |
                df -h /
                sudo rm -rf \
                  /usr/share/dotnet \
                  /usr/share/swift \
                  /usr/local/share/boost \
                  /usr/local/share/powershell \
                  /usr/local/share/chromium \
                  /usr/local/lib/android/sdk/emulator \
                  /usr/local/lib/android/sdk/system-images \
                  /usr/local/.ghcup \
                  /opt/ghc \
                  /opt/microsoft \
                  /opt/google \
                  /opt/az \
                  /opt/hostedtoolcache/CodeQL \
                  /opt/hostedtoolcache/go \
                  /opt/hostedtoolcache/PyPy \
                  /opt/hostedtoolcache/Ruby
                docker image prune --all --force > /dev/null 2>&1 || true
                df -h /
              displayName: Free disk space

            - checkout: self
              fetchDepth: 1

            - template: ci/templates/flutter-setup.yml

            - task: JavaToolInstaller@0
              displayName: Use JDK $(jdkVersion)
              inputs:
                versionSpec: $(jdkVersion)
                jdkArchitectureOption: x64
                jdkSourceOption: PreInstalled

            - task: DownloadSecureFile@1
              name: signingProperties
              displayName: Download signing.properties
              inputs:
                secureFile: signing.properties

            - task: DownloadSecureFile@1
              name: keystore
              displayName: Download release keystore
              inputs:
                secureFile: key-release.jks

            - task: DownloadSecureFile@1
              name: envFile
              displayName: Download env.production
              inputs:
                secureFile: env.production

            - bash: |
                set -euo pipefail
                cp "$(signingProperties.secureFilePath)" android/signing.properties
                cp "$(keystore.secureFilePath)" android/app/key-release.jks
                cp "$(envFile.secureFilePath)" .env.ci
              displayName: Copy signing and env files

            - bash: |
                set -euo pipefail
                flutter build appbundle \
                  --release \
                  --flavor production \
                  --target lib/main.dart \
                  --build-name "$(versionName)" \
                  --build-number "$(buildNumber)" \
                  --obfuscate \
                  --split-debug-info=build/symbols/android \
                  --dart-define-from-file=.env.ci
              displayName: Build Android app bundle

            - bash: |
                set -euo pipefail
                out="$(Build.ArtifactStagingDirectory)"
                mkdir -p "$out/android" "$out/android-symbols"
                find build/app/outputs -name '*-release.aab' -exec cp {} "$out/android/" \;
                find build/app/outputs/mapping -name mapping.txt -exec cp {} "$out/android-symbols/" \; 2>/dev/null || true
                cp -R build/symbols/android/. "$out/android-symbols/"
                ls -la "$out/android"
              displayName: Collect outputs

            - publish: $(Build.ArtifactStagingDirectory)/android
              artifact: android
              displayName: Publish app bundle

            - publish: $(Build.ArtifactStagingDirectory)/android-symbols
              artifact: android-symbols
              displayName: Publish symbols

            - bash: rm -f android/signing.properties android/app/key-release.jks .env.ci
              displayName: Remove signing and env files
              condition: always()

    - stage: Release
      displayName: Release
      dependsOn: Build
      jobs:
        - job: GooglePlay
          displayName: Google Play internal testing
          pool:
            vmImage: ubuntu-latest
          steps:
            - checkout: none
            - download: current
              artifact: android
              displayName: Download app bundle
            - download: current
              artifact: android-symbols
              displayName: Download symbols
            - task: GooglePlayRelease@4
              displayName: Upload to the internal testing track
              inputs:
                serviceConnection: Google Play service connection
                applicationId: com.example.template.prod
                action: SingleBundle
                bundleFile: $(Pipeline.Workspace)/android/*.aab
                track: internal
                releaseName: $(Build.BuildNumber)
                mappingFilePath: $(Pipeline.Workspace)/android-symbols/mapping.txt

        - job: Crashlytics
          displayName: Crashlytics Dart symbols
          condition: ne(variables['firebaseAndroidAppId'], '')
          pool:
            vmImage: ubuntu-latest
          steps:
            - checkout: none
            - download: current
              artifact: android-symbols
              displayName: Download symbols
            - task: DownloadSecureFile@1
              name: crashlyticsKey
              displayName: Download Firebase service account
              inputs:
                secureFile: firebase-crashlytics-sa.json
            - bash: npm install -g firebase-tools
              displayName: Install firebase-tools
            - bash: firebase crashlytics:symbols:upload --app="$(firebaseAndroidAppId)" "$(Pipeline.Workspace)/android-symbols"
              displayName: Upload Dart symbols to Crashlytics
              env:
                GOOGLE_APPLICATION_CREDENTIALS: $(crashlyticsKey.secureFilePath)
