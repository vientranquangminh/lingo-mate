    <div style="display: flex; flex-direction: column; gap: 10px">

        <p style="margin: 0; font-size: 15px; line-height: 22px; color: #5B6070">Xin chào! Anh chị đã đặt bàn trước chưa ạ?</p>
        <p style="margin: 0; font-size: 28px; line-height: 38px; font-weight: 600">Hi! Do you have a reservation?</p>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: #FFFFFF; border: 1px dashed #E4DFD3">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #0F766E"></span>
        <span style="font-size: 15px; line-height: 22px; color: #5B6070; font-style: italic">Could we sit by the window…</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Save to phrasebook" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid #E4DFD3; background: #FFFFFF; color: #14161F; display: flex; align-items: center; justify-content: center">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <button aria-label="Listening. Tap to stop" style="width: 88px; height: 88px; border-radius: 999px; border: none; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(15,118,110,0.16), 0 0 0 20px rgba(15,118,110,0.08)">
          <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <span style="font-size: 13px; font-weight: 600; color: #0F766E">Listening…</span>
      </div>
      <button aria-label="Read translations aloud: on" aria-pressed="true" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid #E4DFD3; background: #FFFFFF; color: #14161F; display: flex; align-items: center; justify-content: center">
